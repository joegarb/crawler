name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - run: ./mvnw verify
      - name: Build Docker image
        run: docker build -t crawler:ci .
      - name: Smoke-test image
        run: docker run --rm crawler:ci --report

  # Publish PR images only for things worth hand-testing: skip Dependabot
  # patch/minor (those auto-merge untested), keep majors and human PRs.
  pr-image-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - id: meta
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v2
      - id: decide
        run: |
          t="${{ steps.meta.outputs.update-type }}"
          if [ "$t" = "version-update:semver-patch" ] || [ "$t" = "version-update:semver-minor" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish-pr:
    if: github.event_name == 'pull_request' && needs.pr-image-check.outputs.publish == 'true'
    needs: [build, pr-image-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ghcr.io/joegarb/crawler:pr-${{ github.event.pull_request.number }}
